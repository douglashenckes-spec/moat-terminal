name: Atualização Diária B3 (Nuvem)

on:
  schedule:
    # 05:43 Horário de Brasília (08:43 UTC) - Garante dados prontos antes das 07:00
    - cron: '43 8 * * *'
    # 12:43 Horário de Brasília (15:43 UTC) - Pega divulgações matinais
    - cron: '43 15 * * *'
    # 19:43 Horário de Brasília (22:43 UTC) - Pega os balanços noturnos da CVM
    - cron: '43 22 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [daily_update]

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Executar Pipeline de Atualização dos Dados B3
        run: |
          python build_standalone_data.py
          python build_standalone_html.py
          python build_company_page.py
          python build_seo_sitemap.py

      - name: Publicar Atualizações no GitHub Pages
        run: |
          git config --global user.name "Moat Terminal Cloud Bot"
          git config --global user.email "bot@moatterminal.com.br"
          git add index.html empresa.html sitemap.xml acoes/ cache/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualizacao automatica B3 na nuvem [$(date +'%d/%m/%Y')]" && git push)
